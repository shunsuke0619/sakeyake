<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>さけやけ</title><link rel="icon" href="icon.jpg"><link rel="apple-touch-icon" href="icon.jpg"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box}body{margin:0;padding:0 0 75px;font-family:sans-serif;background:#f7f5f0;color:#2c2a29}
header{background:#fff;border-bottom:1px solid #e5e0d8;padding:12px;position:sticky;top:0;display:flex;align-items:center;justify-content:center;gap:8px;z-index:10}
header img{width:28px;height:28px;border-radius:6px;object-fit:cover}header h1{margin:0;font-size:1.2rem;letter-spacing:.1em}
.wrap{max-width:480px;margin:0 auto;padding:14px}.note{font-size:.78rem;color:#666;background:#efeae1;padding:10px;border-radius:10px;margin-bottom:12px}
.box{background:#fff;border-radius:14px;padding:14px;border:1px solid #e5e0d8;margin-bottom:14px}.fg{margin-bottom:10px}
label{display:block;font-size:.82rem;font-weight:700;margin-bottom:4px}input,select,textarea{width:100%;padding:9px;border:1px solid #d5cfc7;border-radius:8px;font-size:1rem;background:#faf9f6}
textarea{resize:none;height:80px}.up{display:block;text-align:center;padding:11px;border:1.5px dashed #b8b0a4;border-radius:10px;background:#faf8f5;font-weight:700;cursor:pointer}
.ths{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tb{border:2px solid transparent;border-radius:8px;padding:6px 2px;background:#f5f3ef;font-size:.72rem;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tb.on{border-color:#3d5a73;background:#eef3f7}.sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
#prev{width:100%;max-width:340px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.12);display:block;margin:10px auto}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.btn{border:none;border-radius:10px;padding:12px;font-size:.88rem;font-weight:700;cursor:pointer}
.b1{background:#2f4858;color:#fff}.b2{background:#e8e2d7;color:#2c2a29}.b3{width:100%;background:#7c5c43;color:#fff}
.pg{background:#fff;border-radius:12px;border:1px solid #e5e0d8;margin-bottom:10px;overflow:hidden}.ph{padding:12px;background:#f2eee6;font-weight:700;display:flex;justify-content:space-between;cursor:pointer}
.pgr{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.si{border:1px solid #e5e0d8;border-radius:8px;overflow:hidden}.si img{width:100%;display:block}
.sa{display:flex;justify-content:space-between;padding:5px 8px;font-size:.75rem;background:#fff}
nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;border-top:1px solid #e5e0d8;display:grid;grid-template-columns:1fr 1fr}
.nb{border:none;background:none;font-weight:700;color:#8c867e;font-size:.8rem;cursor:pointer}.nb.on{color:#2f4858}.hide{display:none!important}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}.mod img{max-width:100%;max-height:75vh;border-radius:10px;margin-bottom:12px}
</style>
</head>
<body>
<header><img src="icon.jpg" onerror="this.style.display='none'"><h1>さけやけ</h1></header>
<main id="v1" class="wrap">
<div class="note">写真と文字を入れるとカード画像ができます。写真はこの端末の中だけで処理されます。</div>
<div class="box">
<div class="fg"><label>1. 日本酒の写真</label><label for="ph" class="up">📷 写真を選ぶ・撮影する</label><input type="file" id="ph" accept="image/*" style="display:none"></div>
<div class="fg"><label>2. 背景デザイン</label><div class="ths">
<button type="button" class="tb on" data-t="bg"><span class="sw" style="background:#f5efe4"></span>ベージュ</button>
<button type="button" class="tb" data-t="gr"><span class="sw" style="background:#e3ebe6"></span>くすみ緑</button>
<button type="button" class="tb" data-t="in"><span class="sw" style="background:#233347"></span>藍</button>
<button type="button" class="tb" data-t="sk"><span class="sw" style="background:#f8eaed"></span>さくら</button>
</div></div>
<div class="fg"><label>3. 銘柄名</label><input id="nm" placeholder="例：獺祭 / 鍋島" maxlength="24"></div>
<div class="fg"><label>4. 都道府県</label><select id="pf"><option value="">都道府県を選択</option></select></div>
<div class="fg"><label>5. 日付</label><input type="date" id="dt"></div>
<div class="fg"><label>6. メモ（120文字まで）</label><textarea id="mm" maxlength="120" placeholder="味わいや思い出など"></textarea></div>
</div>
<canvas id="cv" width="900" height="1280" class="hide"></canvas><img id="prev" alt="プレビュー">
<div class="btns"><button type="button" class="btn b1" id="shB">📤 写真に保存/シェア</button><button type="button" class="btn b2" id="dlB">⬇️ ダウンロード</button></div>
<button type="button" class="btn b3" id="rcB">🍶 県別一覧に記録を残す</button>
</main>
<main id="v2" class="wrap hide"><div id="lb"></div></main>
<nav><button type="button" class="nb on" data-v="v1">🍶 カードをつくる</button><button type="button" class="nb" data-v="v2">🗾 県別一覧 (<span id="cn">0</span>)</button></nav>
<div id="md" class="mod hide"><img id="mi"><button type="button" class="btn b2" onclick="document.getElementById('md').classList.add('hide')">閉じる</button></div>
<script>
const PF="北海道,青森県,岩手県,宮城県,秋田県,山形県,福島県,茨城県,栃木県,群馬県,埼玉県,千葉県,東京都,神奈川県,新潟県,富山県,石川県,福井県,山梨県,長野県,岐阜県,静岡県,愛知県,三重県,滋賀県,京都府,大阪府,兵庫県,奈良県,和歌山県,鳥取県,島根県,岡山県,広島県,山口県,徳島県,香川県,愛媛県,高知県,福岡県,佐賀県,長崎県,熊本県,大分県,宮崎県,鹿児島県,沖縄県".split(",");
const TH={bg:{b:"#f6f0e4",f:"#d4c8b4",t:"#2c2825",s:"#6e655c",g:"#e8decb",gt:"#4a4036",p:"#ebe3d3"},gr:{b:"#e5ede8",f:"#b4c7bc",t:"#23332b",s:"#556b60",g:"#d2e0d7",gt:"#2c4237",p:"#d7e3dc"},in:{b:"#1e2d40",f:"#bfa46f",t:"#f7f3eb",s:"#c9c2b5",g:"#2d4159",gt:"#e6cfa1",p:"#293b52"},sk:{b:"#faecef",f:"#e3c3ca",t:"#38282c",s:"#7a6066",g:"#f2dce1",gt:"#5e3d45",p:"#f2dfe3"}};
let cT="bg",uI=null,dU="";const pS=document.getElementById("pf");PF.forEach(p=>{let o=document.createElement("option");o.value=o.textContent=p;pS.appendChild(o)});
const d=new Date();document.getElementById("dt").value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
document.querySelectorAll(".tb").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tb").forEach(x=>x.classList.remove("on"));b.classList.add("on");cT=b.dataset.t;drw()});
document.getElementById("ph").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=v=>{let i=new Image();i.onload=()=>{uI=i;drw()};i.src=v.target.result};r.readAsDataURL(f)};
["nm","pf","dt","mm"].forEach(i=>document.getElementById(i).oninput=drw);
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drw(){
const c=document.getElementById("cv"),x=c.getContext("2d"),t=TH[cT],W=900,H=1280;x.fillStyle=t.b;x.fillRect(0,0,W,H);x.strokeStyle=t.f;x.lineWidth=3;x.strokeRect(36,36,W-72,H-72);
const pX=76,pY=82,pW=W-152,pH=660;x.save();rr(x,pX,pY,pW,pH,16);x.clip();
if(uI){let ir=uI.width/uI.height,br=pW/pH,dw,dh,ox,oy;if(ir>br){dh=pH;dw=pH*ir;ox=pX-(dw-pW)/2;oy=pY}else{dw=pW;dh=pW/ir;ox=pX;oy=pY-(dh-pH)/2}x.drawImage(uI,ox,oy,dw,dh)}
else{x.fillStyle=t.p;x.fillRect(pX,pY,pW,pH);x.fillStyle=t.s;x.font="700 28px sans-serif";x.textAlign="center";x.fillText("ここに日本酒の写真が入ります",W/2,pY+pH/2)}x.restore();
const pv=pS.value||"産地未選択",dv=document.getElementById("dt").value.replace(/-/g,".");x.font="700 26px sans-serif";const tw=x.measureText(pv).width+44;x.fillStyle=t.g;rr(x,pX,774,tw,48,24);x.fill();
x.fillStyle=t.gt;x.textAlign="left";x.fillText(pv,pX+22,807);x.fillStyle=t.s;x.textAlign="right";x.fillText(dv,W-pX,807);
x.fillStyle=t.t;x.font="700 46px serif";x.textAlign="left";x.fillText(document.getElementById("nm").value.trim()||"日本酒の銘柄名",pX,888,pW);
x.strokeStyle=t.f;x.beginPath();x.moveTo(pX,916);x.lineTo(W-pX,916);x.stroke();
const m=document.getElementById("mm").value||"ここに味わいや思い出メモが入ります。";x.fillStyle=t.t;x.font="400 28px sans-serif";
let lc=0;for(const p of m.split("\n")){let l="";for(const ch of p){if(x.measureText(l+ch).width>pW&&l){x.fillText(l,pX,968+lc*44);l=ch;if(++lc>=5)break}else l+=ch}if(lc<5){x.fillText(l,pX,968+lc*44);lc++}}
x.fillStyle=t.s;x.font="700 24px serif";x.textAlign="right";x.fillText("さけやけ",W-pX,H-64);dU=c.toDataURL("image/png");document.getElementById("prev").src=dU}
document.getElementById("shB").onclick=async()=>{try{const b=await(await fetch(dU)).blob(),f=new File([b],"sakeyake.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else alert("画像を長押しして保存してください")}catch{}};
document.getElementById("dlB").onclick=()=>{let a=document.createElement("a");a.href=dU;a.download=`sakeyake_${Date.now()}.png`;a.click()};
const K="sy_v1",gS=()=>{try{return JSON.parse(localStorage.getItem(K))||[]}catch{return[]}},sS=c=>{localStorage.setItem(K,JSON.stringify(c));document.getElementById("cn").textContent=c.length};
document.getElementById("rcB").onclick=()=>{let p=pS.value||"未分類",c=gS();c.unshift({id:Date.now(),p,i:document.getElementById("cv").toDataURL("image/jpeg",.8)});try{sS(c);alert(`${p}の一覧に保存しました！`)}catch{alert("容量がいっぱいです")}};
function rL(){const b=document.getElementById("lb"),c=gS();b.innerHTML=c.length?"":"まだ記録がありません。";const g={};c.forEach(x=>(g[x.p]=g[x.p]||[]).push(x));Object.keys(g).forEach(p=>{let d=document.createElement("div");d.className="pg";d.innerHTML=<div class="ph"><span>${p}</span><span>${g[p].length}件</span></div><div class="pgr"></div>;let gr=d.querySelector(".pgr");g[p].forEach(it=>{let e=document.createElement("div");e.className="si";e.innerHTML=<img src="${it.i}"><div class="sa"><span style="color:#2f4858;font-weight:700;cursor:pointer">拡大</span><span style="color:#b54949;cursor:pointer">削除</span></div>;e.querySelector("img").onclick=e.querySelector("span").onclick=()=>{document.getElementById("mi").src=it.i;document.getElementById("md").classList.remove("hide")};e.querySelectorAll("span")[1].onclick=()=>{if(confirm("削除しますか？")){sS(gS().filter(x=>x.id!==it.id));rL()}};gr.appendChild(e)});b.appendChild(d)})}
document.querySelectorAll(".nb").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nb").forEach(x=>x.classList.remove("on"));b.classList.add("on");let v=b.dataset.v;document.getElementById("v1").classList.toggle("hide",v!=="v1");document.getElementById("v2").classList.toggle("hide",v!=="v2");if(v==="v2")rL()});
window.onload=()=>{drw();document.getElementById("cn").textContent=gS().length};
  </script>
</body>
</html>
