<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>さけやけ｜日本酒フォトログ</title>
<link rel="icon" href="icon.jpg">
<link rel="apple-touch-icon" href="icon.jpg">
<style>
  :root {
    --bg: #faf8f5;
    --card: #ffffff;
    --text: #3e3a39;
    --sub: #7d7773;
    --accent: #b88b76;
    --accent-dark: #9c725e;
    --border: #e6e0d8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: 85px; -webkit-font-smoothing: antialiased; }
  header { background: var(--card); text-align: center; padding: 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 1.2rem; letter-spacing: 0.18em; font-weight: 600; color: var(--text); }
  header p { font-size: 0.72rem; color: var(--sub); font-family: sans-serif; margin-top: 2px; }
  .container { max-width: 500px; margin: 0 auto; padding: 16px; }
  .section { display: none; }
  .section.active { display: block; }
  .box { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
  .label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text); font-family: sans-serif; }
  .file-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; background: #f3efe9; border: 1.5px dashed var(--accent); border-radius: 10px; color: var(--text); font-size: 0.95rem; font-family: sans-serif; font-weight: 600; cursor: pointer; text-align: center; }
  input[type="file"] { display: none; }
  .themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
  .theme-btn { padding: 8px 4px; border-radius: 8px; border: 2px solid transparent; font-size: 0.78rem; font-family: sans-serif; cursor: pointer; text-align: center; font-weight: 600; }
  .theme-btn.active { border-color: var(--text); }
  .t-beige { background: #f4eee6; color: #4a423b; }
  .t-green { background: #e3ebe6; color: #35473d; }
  .t-ai { background: #26394d; color: #f5f7f8; }
  .t-sakura { background: #f9ecef; color: #5c3a41; }
  input[type="text"], input[type="date"], select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 0.95rem; background: #fff; color: var(--text); font-family: sans-serif; margin-bottom: 12px;
  }
  textarea { resize: none; height: 86px; line-height: 1.5; }
  .preview-wrap { text-align: center; }
  .preview-note { font-size: 0.75rem; color: var(--sub); font-family: sans-serif; margin-bottom: 8px; }
  #previewImg { width: 100%; max-width: 360px; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.1); display: inline-block; vertical-align: middle; }
  .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .btn { width: 100%; padding: 13px; border-radius: 10px; border: none; font-size: 0.95rem; font-weight: 600; font-family: sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: #efeae2; color: var(--text); }
  .btn-save { background: #4c6457; color: #fff; }
  .pref-group { margin-bottom: 18px; }
  .pref-title { font-size: 0.95rem; font-weight: 600; padding: 6px 10px; background: #efeae2; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; font-family: sans-serif; }
  .record-card { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 10px; align-items: center; }
  .record-thumb { width: 72px; height: 90px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: #eee; }
  .record-info { flex: 1; min-width: 0; font-family: sans-serif; }
  .record-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .record-date { font-size: 0.75rem; color: var(--sub); margin-bottom: 4px; }
  .record-memo { font-size: 0.8rem; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .del-btn { background: none; border: 1px solid #d9c8c0; color: #9e6b63; font-size: 0.72rem; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-family: sans-serif; }
  .empty-msg { text-align: center; color: var(--sub); font-size: 0.88rem; padding: 40px 10px; font-family: sans-serif; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; height: 64px; z-index: 20; padding-bottom: env(safe-area-inset-bottom); }
  .nav-btn { flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75rem; color: var(--sub); font-family: sans-serif; cursor: pointer; gap: 3px; }
  .nav-btn.active { color: var(--accent-dark); font-weight: 700; }
  .nav-icon { font-size: 1.25rem; }
</style>
</head>
<body>

<header>
  <h1>さけやけ</h1>
  <p>一杯の記憶を、和のカードに</p>
</header>

<div class="container">
  <div id="tab-create" class="section active">
    <div class="box">
      <label class="label">1. 日本酒の写真を選ぶ</label>
      <label for="photoInput" class="file-btn">📷 写真を選択 / カメラで撮影</label>
      <input type="file" id="photoInput" accept="image/*">
    </div>

    <div class="box">
      <label class="label">2. カードの背景色</label>
      <div class="themes" id="themeSelector">
        <button type="button" class="theme-btn t-beige active" data-theme="beige">ベージュ</button>
        <button type="button" class="theme-btn t-green" data-theme="green">くすみ緑</button>
        <button type="button" class="theme-btn t-ai" data-theme="ai">藍</button>
        <button type="button" class="theme-btn t-sakura" data-theme="sakura">さくら</button>
      </div>
    </div>

    <div class="box">
      <label class="label">3. 銘柄名</label>
      <input type="text" id="brandInput" placeholder="例：獺祭 純米大吟醸" maxlength="30">

      <label class="label">4. 都道府県</label>
      <select id="prefSelect"></select>

      <label class="label">5. 飲んだ日</label>
      <input type="date" id="dateInput">

      <label class="label">6. ひとことメモ（120文字まで）</label>
      <textarea id="memoInput" maxlength="120" placeholder="香りや味わい、一緒に食べた料理など"></textarea>
    </div>

    <div class="box preview-wrap">
      <p class="preview-note">▼ 完成カード（長押しでも写真保存できます）</p>
      <img id="previewImg" alt="カードプレビュー">
      <canvas id="cardCanvas" width="900" height="1200" style="display:none;"></canvas>

      <div class="btn-group">
        <button type="button" class="btn btn-primary" id="shareBtn">📤 写真に保存 / SNSシェア</button>
        <button type="button" class="btn btn-secondary" id="downloadBtn">⬇️ 画像をダウンロード</button>
        <button type="button" class="btn btn-save" id="saveListBtn">🍶 県別一覧に記録を残す</button>
      </div>
    </div>
  </div>

  <div id="tab-list" class="section">
    <div id="listContainer"></div>
  </div>
</div>

<nav>
  <button type="button" class="nav-btn active" data-target="tab-create">
    <span class="nav-icon">🖋️</span>
    <span>カードをつくる</span>
  </button>
  <button type="button" class="nav-btn" data-target="tab-list">
    <span class="nav-icon">🗾</span>
    <span>県別一覧 (<span id="totalCount">0</span>)</span>
  </button>
</nav>

<script>
(function() {
  const PREFS = [
    "北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県",
    "茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県",
    "新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県",
    "静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県",
    "奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県",
    "徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県",
    "熊本県","大分県","宮崎県","鹿児島県","沖縄県"
  ];

  const THEMES = {
    beige:  { bg: "#f4eee6", frame: "#dfd5c7", text: "#3e362e", sub: "#7a6f64", accent: "#b88b76" },
    green:  { bg: "#e3ebe6", frame: "#c5d4cb", text: "#2c3d34", sub: "#5e7368", accent: "#6b8f7b" },
    ai:     { bg: "#223344", frame: "#3b526b", text: "#f4f6f8", sub: "#b8c4d0", accent: "#c8a97e" },
    sakura: { bg: "#f9ecef", frame: "#e6cdd3", text: "#4d3036", sub: "#8a626b", accent: "#c97b8b" }
  };

  let currentTheme = "beige";
  let uploadedImage = null;

  const photoInput = document.getElementById("photoInput");
  const brandInput = document.getElementById("brandInput");
  const prefSelect = document.getElementById("prefSelect");
  const dateInput = document.getElementById("dateInput");
  const memoInput = document.getElementById("memoInput");
  const canvas = document.getElementById("cardCanvas");
  const ctx = canvas.getContext("2d");
  const previewImg = document.getElementById("previewImg");

  PREFS.forEach(function(p) {
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = p;
    prefSelect.appendChild(opt);
  });
  prefSelect.value = "東京都";

  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, "0");
  const dd = String(today.getDate()).padStart(2, "0");
  dateInput.value = yyyy + "-" + mm + "-" + dd;

  photoInput.addEventListener("change", function(e) {
    const files = e.target.files;
    if (!files || files.length === 0) return;
    const file = files.item(0);
    const reader = new FileReader();
    reader.onload = function(ev) {
      const img = new Image();
      img.onload = function() {
        uploadedImage = img;
        drawCard();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById("themeSelector").addEventListener("click", function(e) {
    const btn = e.target.closest(".theme-btn");
    if (!btn) return;
document.querySelectorAll(".theme-btn").forEach(function(b) {
b.classList.remove("active");
});
btn.classList.add("active");
currentTheme = btn.dataset.theme;
drawCard();
});
[brandInput, prefSelect, dateInput, memoInput].forEach(function(el) {
el.addEventListener("input", drawCard);
el.addEventListener("change", drawCard);
});
function drawCard() {
const t = THEMES[currentTheme];
const W = canvas.width;
const H = canvas.height;
ctx.fillStyle = t.bg;
ctx.fillRect(0, 0, W, H);
ctx.strokeStyle = t.frame;
ctx.lineWidth = 6;
ctx.strokeRect(32, 32, W - 64, H - 64);
const px = 75, py = 75, pw = 750, ph = 600;
ctx.fillStyle = t.frame;
ctx.fillRect(px, py, pw, ph);
if (uploadedImage) {
const ir = uploadedImage.width / uploadedImage.height;
const br = pw / ph;
let sx = 0, sy = 0, sw = uploadedImage.width, sh = uploadedImage.height;
if (ir > br) {
sw = uploadedImage.height * br;
sx = (uploadedImage.width - sw) / 2;
} else {
sh = uploadedImage.width / br;
sy = (uploadedImage.height - sh) / 2;
}
ctx.drawImage(uploadedImage, sx, sy, sw, sh, px, py, pw, ph);
} else {
ctx.fillStyle = t.sub;
ctx.font = "28px sans-serif";
ctx.textAlign = "center";
ctx.fillText("ここに日本酒の写真が入ります", W / 2, py + ph / 2);
}
ctx.textAlign = "left";
ctx.fillStyle = t.accent;
ctx.font = "bold 28px sans-serif";
ctx.fillText("📍 " + prefSelect.value, 75, 735);
ctx.textAlign = "right";
ctx.fillStyle = t.sub;
ctx.font = "26px sans-serif";
ctx.fillText(dateInput.value.replace(/-/g, "."), W - 75, 735);
ctx.textAlign = "left";
ctx.fillStyle = t.text;
ctx.font = "bold 46px serif";
const brand = brandInput.value.trim() || "銘柄名を入力";
ctx.fillText(brand.slice(0, 16), 75, 805);
ctx.strokeStyle = t.frame;
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(75, 835);
ctx.lineTo(W - 75, 835);
ctx.stroke();
ctx.fillStyle = t.text;
ctx.font = "28px sans-serif";
const memo = memoInput.value || "ひとことメモがここに表示されます。";
wrapText(ctx, memo, 75, 885, W - 150, 44, 5);
ctx.textAlign = "right";
ctx.fillStyle = t.sub;
ctx.font = "22px serif";
ctx.fillText("さけやけ", W - 75, H - 55);
previewImg.src = canvas.toDataURL("image/jpeg", 0.92);
}
function wrapText(context, text, x, y, maxWidth, lineHeight, maxLines) {
const paragraphs = text.split("\n");
let lineCount = 0;
for (let p = 0; p < paragraphs.length; p++) {
const chars = paragraphs[p].split("");
let line = "";
for (let n = 0; n < chars.length; n++) {
const testLine = line + chars[n];
if (context.measureText(testLine).width > maxWidth && n > 0) {
context.fillText(line, x, y + lineCount * lineHeight);
line = chars[n];
lineCount++;
if (lineCount >= maxLines) return;
} else {
line = testLine;
}
}
context.fillText(line, x, y + lineCount * lineHeight);
lineCount++;
if (lineCount >= maxLines) return;
}
}
document.getElementById("shareBtn").addEventListener("click", function() {
canvas.toBlob(async function(blob) {
const file = new File([blob], "sakeyake_card.jpg", { type: "image/jpeg" });
if (navigator.canShare && navigator.canShare({ files: [file] })) {
try {
await navigator.share({
files: [file],
title: "さけやけ｜日本酒の記録"
});
} catch (err) {
if (err.name !== "AbortError") alert("シェアに失敗しました。画像を長押しして保存してください。");
}
} else {
alert("お使いのブラウザは直接シェアに対応していません。上のカード画像を長押しして『写真に保存』してください。");
}
}, "image/jpeg", 0.92);
});
document.getElementById("downloadBtn").addEventListener("click", function() {
const link = document.createElement("a");
link.download = "sakeyake_" + dateInput.value + ".jpg";
link.href = canvas.toDataURL("image/jpeg", 0.92);
link.click();
});
function getRecords() {
try { return JSON.parse(localStorage.getItem("sakeyake_records") || "[]"); }
catch (e) { return []; }
}
document.getElementById("saveListBtn").addEventListener("click", function() {
const brand = brandInput.value.trim();
if (!brand) {
alert("銘柄名を入力してください。");
return;
}
const thumbCanvas = document.createElement("canvas");
thumbCanvas.width = 240;
thumbCanvas.height = 320;
thumbCanvas.getContext("2d").drawImage(canvas, 0, 0, 240, 320);
const records = getRecords();
records.unshift({
id: Date.now(),
brand: brand,
pref: prefSelect.value,
date: dateInput.value,
memo: memoInput.value,
thumb: thumbCanvas.toDataURL("image/jpeg", 0.75)
});
try {
localStorage.setItem("sakeyake_records", JSON.stringify(records));
updateCount();
alert("「" + prefSelect.value + "」の記録に保存しました！");
} catch (e) {
alert("保存容量がいっぱいです。不要な記録を削除してください。");
}
});
function renderList() {
const records = getRecords();
const container = document.getElementById("listContainer");
updateCount();
if (records.length === 0) {
container.innerHTML = 'まだ記録がありません。
「カードをつくる」から最初の1杯を記録しましょう！';
return;
}
const grouped = {};
PREFS.forEach(function(p) { grouped[p] = []; });
records.forEach(function(r) {
if (!grouped[r.pref]) grouped[r.pref] = [];
grouped[r.pref].push(r);
});
let html = "";
PREFS.forEach(function(pref) {
const items = grouped[pref];
if (items.length === 0) return;
html += '📍 ' + pref + '' + items.length + '件';
items.forEach(function(item) {
html += '' + escapeHtml(item.brand) + '' + item.date + '' + escapeHtml(item.memo) + '削除';
});
html += '';
});
container.innerHTML = html;
}
document.getElementById("listContainer").addEventListener("click", function(e) {
const btn = e.target.closest(".del-btn");
if (!btn) return;
if (!confirm("この記録を削除しますか？")) return;
const id = Number(btn.dataset.id);
const records = getRecords().filter(function(r) { return r.id !== id; });
localStorage.setItem("sakeyake_records", JSON.stringify(records));
renderList();
});
function updateCount() {
document.getElementById("totalCount").textContent = getRecords().length;
}
function escapeHtml(str) {
const map = { "&": "&", "<": "<", ">": ">", '"': """, "'": "'" };
return String(str).replace(/[&<>"']/g, function(s) { return map[s]; });
}
document.querySelectorAll(".nav-btn").forEach(function(btn) {
btn.addEventListener("click", function() {
document.querySelectorAll(".nav-btn").forEach(function(b) { b.classList.remove("active"); });
document.querySelectorAll(".section").forEach(function(s) { s.classList.remove("active"); });
this.classList.add("active");
const target = this.dataset.target;
document.getElementById(target).classList.add("active");
if (target === "tab-list") renderList();
});
});
drawCard();
updateCount();
})();
</script>
</body>
</html>
